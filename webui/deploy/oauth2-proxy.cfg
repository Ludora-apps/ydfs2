provider = "github"
http_address = "127.0.0.1:4180"
reverse_proxy = true
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]
upstreams = ["static://202"]
email_domains = ["*"]
set_xauthrequest = true
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_name = "__Host-ydfs_session"
cookie_expire = "12h"
skip_provider_button = true

# One CSRF cookie per login attempt. With a single shared cookie, two logins in
# flight — a second tab, a restored window, a double click — fight over it: the
# first callback to complete clears it, and every other callback then fails with
# "none was a CSRF cookie", a 403 on a sign-in that was otherwise working.
cookie_csrf_per_request = true
cookie_csrf_per_request_limit = 5
# Long enough to survive a GitHub authorization page left open for a while.
cookie_csrf_expire = "30m"

# OAuth client credentials, redirect URL, cookie secret, and allowed GitHub
# usernames are supplied through the service EnvironmentFile.
